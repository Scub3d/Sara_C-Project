<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenna Face Assets</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { margin: 0; padding: 16px; background: #1b1b22; color: #e8e8ee; font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
  .bar code { background: #2a2a34; padding: 2px 6px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { background: #262630; border-radius: 8px; padding: 10px; }
  .card h3 { font-size: 14px; margin: 0 0 6px; }
  .card p { margin: 6px 0 0; color: #a8a8b8; font-size: 13px; }
  .screen { background: var(--screen-bg); aspect-ratio: 4 / 3; border-radius: 6px; display: block; width: 100%; object-fit: contain; }
  .frames { display: flex; gap: 4px; margin-top: 6px; }
  .frames figure { margin: 0; flex: 1; text-align: center; font-size: 11px; color: #a8a8b8; }
  .frames img { width: 100%; }
  video, canvas.noise { width: 100%; border-radius: 6px; background: #000; display: block; }
  canvas.noise { aspect-ratio: 16 / 9; }
  .ab { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ab div { font-size: 12px; color: #a8a8b8; }
</style>
</head>
<body>
<h1>Tenna face assets</h1>
<h2>Commissioned faces (artist renders). Big tile = frames cycling closed → open → closed; small = frames, closed → open</h2>
<div class="grid" id="Commissioned"></div>

<h2>Transitions (slides 6, 8). Static: original video vs generated live (0 MB)</h2>
<div class="grid" id="transitions"></div>


<script src="assets/manifest.js"></script>
<script src="assets/static-noise.js"></script>
<script>
  const M = window.FACE_MANIFEST;

  const loops = [];
  for (const set of M.faces) {
    const grid = document.getElementById(set.style);
    if (!grid) continue;
    const dir = `assets/${set.dir}/`;
    const card = document.createElement('div');
    card.className = 'card';
    const extras = Object.entries(set.extras || {});
    card.innerHTML = `<h3>${set.id}${set.slide ? ' · slide ' + set.slide : ''}</h3>
      <img class="screen" src="${dir}${set.frames[0]}" alt="">
      ${set.frames.length + extras.length < 2 ? '' : `<div class="frames">
        ${set.frames.map(f => `<figure><img class="screen" src="${dir}${f}" alt=""><figcaption>${f}</figcaption></figure>`).join('')}
        ${extras.map(([k, f]) => `<figure><img class="screen" src="${dir}${f}" alt=""><figcaption>${k}</figcaption></figure>`).join('')}
      </div>`}
      <p>${set.looks}</p>`;
    grid.append(card);
    // the original video's loop if there is one, else ping-pong through the frames: 0 1 2 3 4 3 2 1
    const seq = set.sourceLoop || set.frames.concat(set.frames.slice(1, -1).reverse());
    loops.push({ img: card.querySelector('img'), dir, seq });
  }
  let tick = 0;
  setInterval(() => {
    tick++;
    for (const l of loops) l.img.src = l.dir + l.seq[tick % l.seq.length];
  }, 1000 / M.posesPerSecond);

  const vid = f => `<video src="assets/${f}" controls muted playsinline preload="metadata"></video>`;
  for (const kind of ['transitions', 'channels']) {
    for (const v of M[kind]) {
      const isStatic = v.file.includes('static');
      const card = document.createElement('div');
      card.className = 'card';
      const b = v.small ? vid(v.small) : isStatic ? '<canvas class="noise"></canvas>' : '';
      card.innerHTML = `<h3>${v.file.split('/').pop()} · slide ${v.slide}</h3>
        ${b ? `<div class="ab"><div>original <span class="mb" data-f="${v.file}"></span>${vid(v.file)}</div>
               <div>${isStatic ? 'generated · 0 MB' : `small <span class="mb" data-f="${v.small}"></span>`}${b}</div></div>` : vid(v.file)}
        <p>${v.seconds.toFixed(0)} s · ${v.size.join('×')}${v.warning ? ' · ⚠ ' + v.warning : ''}</p>`;
      document.getElementById(kind)?.append(card);
      if (isStatic) StaticNoise(card.querySelector('canvas')).start();
    }
  }
  // file sizes (needs a web server; skipped when opened from disk)
  for (const el of document.querySelectorAll('.mb')) {
    fetch('assets/' + el.dataset.f, { method: 'HEAD' })
      .then(r => { const n = +r.headers.get('content-length'); if (n) el.textContent = '· ' + (n / 1048576).toFixed(1) + ' MB'; })
      .catch(() => {});
  }
</script>
</body>
</html>
