<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tenna mouth test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
           background: #000; color: #eee; font: 20px/1.4 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; }
  #start button { font: inherit; font-size: 28px; padding: 18px 40px; border-radius: 14px; border: 0; background: #2a8cff; color: #fff; }
  #start small { opacity: .6; font-size: 14px; }
  #debug { position: fixed; left: 8px; top: 8px; padding: 8px 10px; background: rgba(0,0,0,.6); color: #0f0; font: 12px/1.5 monospace;
           border-radius: 8px; display: none; z-index: 2; }
  #debug label { display: block; color: #ccc; }
  #debug input[type=range] { width: 180px; vertical-align: middle; }
  #meter { width: 180px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin: 4px 0; }
  #meter i { display: block; height: 100%; width: 0; background: #0f0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <div>Tenna mouth sync test</div>
  <button id="go">Tap to start</button>
  <small>Allow microphone. Stay quiet for the first 2 seconds so it can learn the noise floor.<br>
  Double-tap anywhere to show or hide the tuning panel.</small>
</div>

<div id="debug">
  <div>level: <span id="dLevel">-</span> dB &nbsp; floor: <span id="dFloor">-</span> dB &nbsp; state: <span id="dState">-</span></div>
  <div id="meter"><i id="meterBar"></i></div>
  <label>open threshold (dB above floor): <span id="vOpen"></span><br><input id="sOpen" type="range" min="3" max="30" step="1"></label>
  <label>close threshold (dB above floor): <span id="vClose"></span><br><input id="sClose" type="range" min="1" max="25" step="1"></label>
  <label>wide threshold (dB above floor): <span id="vWide"></span><br><input id="sWide" type="range" min="6" max="40" step="1"></label>
  <label>release speed: <span id="vRel"></span><br><input id="sRel" type="range" min="0.05" max="0.6" step="0.01"></label>
  <div><button id="recal">Re-learn noise floor</button></div>
</div>

<script>
(() => {
  // ---------- tunables (persisted in localStorage) ----------
  const DEFAULTS = { open: 12, close: 7, wide: 22, release: 0.25 };
  let cfg = { ...DEFAULTS };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('mouthcfg') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('mouthcfg', JSON.stringify(cfg)); } catch (e) {} };

  // ---------- audio ----------
  let ctx, analyser, buf;
  let floorDb = -60, level = -100, calibrating = 0, calSamples = [];
  let mouth = 0;          // 0 closed, 1 half, 2 open, 3 wide
  let mouthAmt = 0;       // 0..1 smoothed openness used for drawing

  async function startAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0;
    src.connect(analyser);
    buf = new Float32Array(analyser.fftSize);
    await ctx.resume();
    recalibrate();
  }

  function recalibrate() { calibrating = performance.now() + 2000; calSamples = []; }

  function readLevel() {
    if (!analyser) return;
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const db = 20 * Math.log10(rms + 1e-8);
    // fast attack, slower release
    level = db > level ? db : level + (db - level) * cfg.release;

    if (calibrating) {
      calSamples.push(db);
      if (performance.now() > calibrating) {
        calSamples.sort((a, b) => a - b);
        floorDb = calSamples[Math.floor(calSamples.length * 0.9)]; // 90th percentile of the quiet period
        calibrating = 0;
      }
      return;
    }
    const rel = level - floorDb;
    // hysteresis: open above cfg.open, close below cfg.close
    if (mouth === 0 && rel > cfg.open) mouth = 2;
    else if (mouth > 0 && rel < cfg.close) mouth = 0;
    if (mouth > 0) {
      if (rel > cfg.wide) mouth = 3;
      else if (rel > cfg.open) mouth = 2;
      else mouth = 1;
    }
  }

  // ---------- drawing ----------
  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  let nextBlink = performance.now() + 2500, blinkT = 0;
  function draw(now) {
    // smooth the mouth toward its target state
    const target = [0, 0.35, 0.7, 1][mouth];
    mouthAmt += (target - mouthAmt) * (target > mouthAmt ? 0.5 : 0.25);

    // blink schedule
    if (now > nextBlink) { blinkT = now; nextBlink = now + 2500 + Math.random() * 4000; }
    const b = Math.min((now - blinkT) / 140, 1);            // 0..1 over 140 ms
    const eyeOpen = b < 1 ? Math.abs(Math.cos(b * Math.PI)) : 1;

    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    const s = Math.min(W / 4, H / 3);                        // scale unit for a 4:3 face
    const cx = W / 2, cy = H / 2;
    const col = '#38f2ff';
    g.fillStyle = col; g.strokeStyle = col; g.lineCap = 'round';
    g.shadowColor = col; g.shadowBlur = s * 0.15;

    // eyes
    const ew = s * 0.55, eh = s * 0.32 * Math.max(eyeOpen, 0.08);
    for (const dx of [-1, 1]) {
      g.beginPath();
      g.ellipse(cx + dx * s * 0.8, cy - s * 0.45, ew / 2, eh / 2, 0, 0, Math.PI * 2);
      g.fill();
    }

    // mouth: a lens that grows in height with mouthAmt
    const mw = s * 1.3, mh = s * 0.06 + mouthAmt * s * 0.7;
    const my = cy + s * 0.55;
    g.beginPath();
    g.moveTo(cx - mw / 2, my);
    g.quadraticCurveTo(cx, my + mh, cx + mw / 2, my);
    g.quadraticCurveTo(cx, my - mh * 0.5, cx - mw / 2, my);
    g.fill();
    g.shadowBlur = 0;
  }

  function loop(now) { readLevel(); draw(now); updateDebug(); requestAnimationFrame(loop); }

  // ---------- debug / tuning panel ----------
  const dbg = document.getElementById('debug');
  const $ = id => document.getElementById(id);
  const bind = (slider, label, key) => {
    $(slider).value = cfg[key]; $(label).textContent = cfg[key];
    $(slider).addEventListener('input', e => { cfg[key] = +e.target.value; $(label).textContent = cfg[key]; save(); });
  };
  bind('sOpen', 'vOpen', 'open'); bind('sClose', 'vClose', 'close'); bind('sWide', 'vWide', 'wide'); bind('sRel', 'vRel', 'release');
  $('recal').addEventListener('click', recalibrate);
  function updateDebug() {
    if (dbg.style.display !== 'block') return;
    $('dLevel').textContent = level.toFixed(1);
    $('dFloor').textContent = calibrating ? 'learning' : floorDb.toFixed(1);
    $('dState').textContent = ['closed', 'half', 'open', 'wide'][mouth];
    $('meterBar').style.width = Math.max(0, Math.min(100, (level + 70) / 70 * 100)) + '%';
  }
  let lastTap = 0;
  canvas.addEventListener('pointerdown', () => {
    const t = performance.now();
    if (t - lastTap < 350) dbg.style.display = dbg.style.display === 'block' ? 'none' : 'block';
    lastTap = t;
  });

  // ---------- start (must be a user gesture for Safari) ----------
  $('go').addEventListener('click', async () => {
    try {
      await startAudio();
      $('start').style.display = 'none';
      try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
      requestAnimationFrame(loop);
    } catch (e) {
      alert('Microphone failed: ' + e.message + '\nThe page must be served over HTTPS (or localhost) for Safari to allow the mic.');
    }
  });
})();
</script>
</body>
</html>
